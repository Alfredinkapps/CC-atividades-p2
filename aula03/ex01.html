<!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>    
      
        <div class="botoes">
        <button onclick="digitar(1)">1</button>
        <button onclick="digitar(2)">2</button>
        <button onclick="digitar(3)">3</button>
        <button onclick="digitar(4)">4</button>
        <button onclick="digitar(5)">5</button>
        <button onclick="digitar(6)">6</button>
        <button onclick="digitar(7)">7</button>
        <button onclick="digitar(8)">8</button>
        <button onclick="digitar(9)">9</button>
        <button onclick="digitar(0)">0</button>
        <button onclick="operar('+')">+</button>
        <button onclick="operar('-')">-</button>
        <button onclick="operar('*')">*</button>
        <button onclick="calcular()">=</button>
        <button onclick="limpar()">C</button>
    
    </div>
       
    <div id="tela"></div>
       
       <script>    
    
            let display = "";
            let primeiroValor = null;
            let operador = null;

            function atualizarTela() {
                document.getElementById("tela").innerText = display || "0";
            }

            function digitar(numero) {
                display += numero;
                atualizarTela();
            }

            function operar(op) {
                primeiroValor = Number(display);
                operador = op;
                display = "";
            }

            function calcular() {
                let segundoValor = Number(display);
                let resultado;

                if (operador === "+") resultado = primeiroValor + segundoValor;
                else if (operador === "-") resultado = primeiroValor - segundoValor;
                else if (operador === "*") resultado = primeiroValor * segundoValor;

                display = String(resultado);
                atualizarTela();
                operador = null;
            }
        </script>
    </body>
    </html>
